[build-system]
requires = [
  "setuptools>=77.0",
  "wheel",
  "cmake>=3.24",
  "cython>=0.28",
  "z3-solver",
]
build-backend = "setuptools.build_meta"

[project]
name = "cleave"
version = "0.0.0"
description = "Cleave codegen and scheduling project"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
