[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = tests/graph/handwritten/handwritten_schedules tests/graph/handwritten/expected_kernels tests/graph/log_viz tests/schedule/log
addopts =
    -n auto
    --reruns 10
    --ignore=tests/schedule/end2end/test_rowsum_div.py
    --ignore=tests/graph/apply_tiling/test_matmul_softmax.py
    # Large-N split-combine currently hits TileLang TMA copy corruption; see rmsnorm_split_combine_tma_issue.md.
    --deselect=tests/graph/apply_tiling/test_rmsnorm_matmul_split_combine.py::test_apply_tiling_rmsnorm_matmul_split_combine
    --deselect=tests/schedule/end2end/test_rmsnorm_matmul_split_combine.py::test_rmsnorm_matmul_split_combine
    # TileLang's cost-model layout inference discards every infer-root attempt for this kernel and aborts with "no available layout found" (layout_inference.cc:1163); both TILELANG_LAYOUT_COST_MODEL values fail identically.
    --deselect=tests/graph/handwritten/test_rmsnorm_matmul_split_combine.py::test_rmsnorm_matmul_split_combine
    # TileLang reference kernel hits invalid Hopper mbarrier lowering for the small-K row-sum case; see matmul_rowsum_small_k_tilelang_mbarrier_issue.md.
    --deselect=tests/reference/test_matmul_rowsum.py::test_matmul_rowsum_small_k
