[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = tests/graph/handwritten/handwritten_schedules tests/graph/handwritten/expected_kernels
# Applied by path in conftest.py (pytest_collection_modifyitems).
markers =
    gpu: compiles or runs kernels on a GPU
    expected: compares generated code to checked-in expected kernels or snapshots
    search: runs the superoptimizer or tiling search
    slow: long-running search, end-to-end or perf test
addopts =
    -n auto
    --deselect=tests/schedule/end2end/test_end2end.py::test_end2end[rowsum_div]
    --ignore=tests/graph/apply_tiling/test_matmul_softmax.py
    # Large-N split-combine currently hits TileLang TMA copy corruption.
    --deselect=tests/graph/apply_tiling/test_rmsnorm_matmul_split_combine.py::test_apply_tiling_rmsnorm_matmul_split_combine
    --deselect=tests/schedule/end2end/test_end2end.py::test_end2end[rmsnorm_matmul_split_combine]
    # TileLang's cost-model layout inference discards every infer-root attempt for this kernel and aborts with "no available layout found" (layout_inference.cc:1163); both TILELANG_LAYOUT_COST_MODEL values fail identically.
    --deselect=tests/graph/handwritten/test_handwritten.py::test_handwritten[rmsnorm_matmul_split_combine]
    # TileLang's reference kernel for the small-K row-sum case hits invalid Hopper mbarrier lowering.
    --deselect=tests/reference/test_matmul_rowsum.py::test_matmul_rowsum_small_k
